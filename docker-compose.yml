version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: plataforma_educativa
    command:
      --lower_case_table_names=1
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - plataforma-network

  redis:
    image: redis:7.2-alpine
    container_name: plataforma-redis
    ports:
      - "6379:6379"
    networks:
      - plataforma-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: plataforma-redis-commander
    ports:
      - "8083:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - plataforma-network

volumes:
  mysql_data:

networks:
  plataforma-network:
    driver: bridge
